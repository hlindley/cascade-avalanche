<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Memory Map · Photo Modes v8</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#081019}body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}#map{position:absolute;inset:0}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#03060944,transparent 28%,transparent 66%,#03060999)}#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;visibility:hidden;pointer-events:none;z-index:4;transition:opacity .22s ease}.top{position:absolute;z-index:6;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.glass{background:#070b10c9;border:1px solid #ffffff24;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.chip{padding:9px 11px;border-radius:15px;pointer-events:auto;max-width:72vw}.chip b{display:block;font-size:12px}.chip span{display:block;color:#aab4c0;font-size:10px;margin-top:2px}.status{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:999px;padding:8px 12px;color:#aab4c0;font-size:11px}.status.ready{display:none}.moments{position:absolute;z-index:6;left:10px;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 92px);border-radius:15px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.tray{position:absolute;z-index:6;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:17px;padding:8px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{border:1px solid #ffffff24;background:#ffffff0e;color:#fff;border-radius:11px;padding:11px 7px;font-weight:700}button.active{background:#aa94ff3a;border-color:#bea9ff85}.moment{text-align:left}.moment b{display:block}.moment small{color:#aab4c0}.note{margin-top:7px;color:#aeb8c4;font-size:9px;line-height:1.35}.maplibregl-ctrl-attrib{font-size:8px!important;opacity:.5}</style></head><body><div id="map"></div><div class="shade"></div><img id="photo" alt="Trip photo"><div id="status" class="status glass">Starting map…</div><div class="top"><div class="chip glass" id="info"><b>NYC Saturday</b><span>Loading world first…</span></div><div class="chip glass" id="pose">WORLD</div></div><div class="moments glass"><button id="noho" class="moment active"><b>NoHo</b><small>5:36 PM</small></button><button id="flatiron" class="moment"><b>Flatiron</b><small>1:14 PM</small></button></div><div class="tray glass"><div class="modes"><button id="world" class="active">World</button><button id="scene">Scene</button><button id="pov">POV</button><button id="photoBtn">Photo</button></div><div class="note" id="note">Photo is now isolated from the WebGL map and preloaded separately.</div></div><script type="module">import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';const $=id=>document.getElementById(id);const M={noho:{name:'NoHo façades',time:'5:36 PM',photo:'./assets/noho-v8.jpg',world:{center:[-73.985,40.748],zoom:12.65,pitch:62,bearing:-27},scene:{center:[-73.9940,40.7265],zoom:18.2,pitch:78,bearing:58},pov:{center:[-73.99378,40.72668],zoom:20,pitch:96,bearing:58,elevation:18}},flatiron:{name:'Flatiron aperitivo',time:'1:14 PM',photo:'./assets/flatiron-v8.jpg',world:{center:[-73.985,40.748],zoom:12.65,pitch:62,bearing:-27},scene:{center:[-73.9893,40.7422],zoom:18,pitch:67,bearing:194},pov:{center:[-73.98965,40.74111],zoom:19.5,pitch:90,bearing:194,elevation:12}}};const style={version:8,sources:{osm:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},layers:[{id:'bg',type:'background',paint:{'background-color':'#081019'}},{id:'roads',type:'line',source:'osm','source-layer':'transportation',paint:{'line-color':'#303641','line-opacity':.52,'line-width':['interpolate',['linear'],['zoom'],10,.3,16,1.8]}},{id:'buildings',type:'fill-extrusion',source:'osm','source-layer':'building',minzoom:12.4,paint:{'fill-extrusion-color':'#283540','fill-extrusion-height':['interpolate',['linear'],['zoom'],12.4,0,14,['*',['coalesce',['get','render_height'],8],.83]],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.82}}]};let key='noho',mode='world',map,ready=false;const photo=$('photo'),buttons={world:$('world'),scene:$('scene'),pov:$('pov'),photo:$('photoBtn')},mom={noho:$('noho'),flatiron:$('flatiron')};const cache={};function preload(k){return cache[k]||(cache[k]=new Promise((resolve,reject)=>{const im=new Image();im.decoding='async';im.onload=()=>resolve(im);im.onerror=reject;im.src=M[k].photo}))}preload('noho');preload('flatiron');function active(g,k){Object.entries(g).forEach(([n,b])=>b.classList.toggle('active',n===k))}function update(){const m=M[key];$('info').innerHTML='<b>'+m.time+' · '+m.name+'</b><span>'+(mode==='photo'?'Actual photograph.':'World / Scene / POV map view.')+'</span>';$('pose').textContent=mode.toUpperCase()}function cut(on){if(ready)map.setPaintProperty('buildings','fill-extrusion-opacity',on?.25:.82)}function hidePhoto(){photo.style.opacity=0;setTimeout(()=>{if(mode!=='photo')photo.style.visibility='hidden'},240)}async function showPhoto(){mode='photo';active(buttons,'photo');cut(false);$('note').textContent='Loading photo…';try{await Promise.race([preload(key),new Promise((_,r)=>setTimeout(()=>r(new Error('photo timeout')),2500))]);photo.src=M[key].photo;photo.style.visibility='visible';requestAnimationFrame(()=>photo.style.opacity=1);$('note').textContent='Photo loaded. Map remains alive underneath.'}catch(e){$('note').textContent='Photo failed to load; map is still active. '+e.message;mode='pov';active(buttons,'pov')}update()}function go(n){if(n==='photo'){showPhoto();return}mode=n;active(buttons,n);hidePhoto();cut(n==='scene');if(ready)map.easeTo({...M[key][n],duration:900,essential:true});update()}function sw(k){key=k;active(mom,k);preload(k);if(mode==='photo'){hidePhoto();mode='world'}go(mode)}map=new maplibregl.Map({container:'map',style,...M.noho.world,maxPitch:105,centerClampedToGround:false,fadeDuration:0,canvasContextAttributes:{antialias:true}});map.on('style.load',()=>{ready=true;$('status').classList.add('ready');sw('noho')});map.on('error',e=>{if(!ready)$('status').textContent='Map error: '+(e.error?.message||'unknown')});mom.noho.onclick=()=>sw('noho');mom.flatiron.onclick=()=>sw('flatiron');buttons.world.onclick=()=>go('world');buttons.scene.onclick=()=>go('scene');buttons.pov.onclick=()=>go('pov');buttons.photo.onclick=()=>go('photo');</script></body></html>
