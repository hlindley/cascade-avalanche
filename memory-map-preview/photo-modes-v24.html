<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Memory Map · Photo Transport v24</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.3.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="./photo-modes-v13.css">
<script type="importmap">{"imports":{"https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs":"https://cdn.jsdelivr.net/npm/maplibre-gl@6.3.0/dist/maplibre-gl.mjs"}}</script>
<style>
#photoCanvas{position:absolute;inset:0;z-index:3;width:100%;height:100%;opacity:0;visibility:hidden;pointer-events:none!important;transition:opacity .42s ease;background:#05070a}
#photoCanvas.visible{opacity:1;visibility:visible}
#photoBtn{transition:opacity .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
#photoBtn[aria-disabled="true"]{opacity:.34;filter:saturate(.25)}
#photoBtn[aria-disabled="false"]{opacity:1;filter:none;box-shadow:inset 0 0 0 1px #69e3cd88;border-color:#69e3cd88}
#photoBtn.loading[aria-disabled="false"]{animation:photoPulse 1.05s ease-in-out infinite}
#photoBtn.active{background:#aa94ff3a;border-color:#bea9ff85;animation:none}
@keyframes photoPulse{0%,100%{opacity:.68}50%{opacity:1}}
body.photo-visible .shade{opacity:.1}
.photoMarkerRoot{width:94px;height:100px;pointer-events:auto}.photoMarkerRoot.micro{width:78px;height:84px}
.photoMarkerCard{appearance:none;-webkit-appearance:none;width:94px;padding:0;border:0;background:transparent;color:#fff;filter:drop-shadow(0 9px 16px #0009);transition:opacity .4s ease,transform .5s ease}.photoMarkerRoot.micro .photoMarkerCard{width:78px}
.photoMarkerCard .mosaic{position:relative;width:84px;height:64px;margin:auto;border:2px solid #f4fffcf0;border-radius:13px;overflow:hidden;background:#14202a;box-shadow:0 0 0 5px #69e3cd29;display:grid;gap:2px;padding:2px}.photoMarkerRoot.micro .mosaic{width:70px;height:52px}
.photoMarkerCard canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;background:#1a2732}.layout-1{grid-template-columns:1fr}.layout-2{grid-template-columns:1fr 1fr}.layout-3{grid-template-columns:1.25fr .75fr;grid-template-rows:1fr 1fr}.layout-3 canvas:first-child{grid-row:1/3}.layout-plus{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.moreBadge{position:absolute;right:5px;bottom:5px;min-width:26px;height:22px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#04080ddd;border:1px solid #ffffffc2;font-size:10px;font-weight:800}
.markerLabel{display:block;margin-top:7px;text-align:center;text-shadow:0 2px 7px #000,0 0 12px #000}.markerLabel b,.markerLabel small{display:block;line-height:1.15}.markerLabel b{font-size:11px;white-space:nowrap}.markerLabel small{font-size:9px;color:#c8d4dc;margin-top:2px}
.photoMarkerCard.world{opacity:1;transform:scale(1)}.photoMarkerCard.transit{opacity:.9;transform:scale(.9)}.photoMarkerCard.cluster{opacity:1;transform:scale(.94)}.photoMarkerCard.hidden{opacity:0;transform:translateY(10px) scale(.72);pointer-events:none}.photoMarkerCard.active .mosaic{border-color:#fff2ba;box-shadow:0 0 0 6px #fff2ba38,0 0 24px #fff2ba40}
</style>
</head>
<body>
<div id="map"></div><div class="shade"></div><canvas id="photoCanvas"></canvas><div id="status" class="status glass">Starting map…</div>
<div class="top"><div class="chip glass" id="info"><b>NYC Saturday</b><span>Loading map and photographs…</span></div><div class="chip glass" id="pose">WORLD</div></div>
<div class="navigator glass"><div class="clusters"><button id="cluster-flatiron" class="cluster"><b>Flatiron</b><small>1 photo</small></button><button id="cluster-noho" class="cluster"><b>NoHo</b><small>10 photos</small></button><button id="cluster-central" class="cluster"><b>Central Park</b><small>1 photo</small></button></div><div class="observationNav"><button id="prevObservation" class="arrow">‹</button><div class="observationInfo"><b id="observationTitle">Trip overview</b><span id="observationMeta">12 photos · 3 clusters</span></div><button id="nextObservation" class="arrow">›</button></div><div id="dots" class="dots"></div></div>
<div class="tray glass"><div class="modes"><button id="world" class="active">World</button><button id="clusterMode">Cluster</button><button id="pov">POV</button><button id="photoBtn" type="button" aria-disabled="true">Photo</button></div><div class="note" id="note">Photos are reconstructed from same-origin atlas chunks, not a data URL or WebGL texture.</div></div>
<script type="module" src="./photo-modes-v24-app.js"></script>
</body>
</html>
