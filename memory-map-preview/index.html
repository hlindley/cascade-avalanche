<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>Memory Map — NYC Saturday</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07090e;color:#f8f4ec}#map{position:absolute;inset:0}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 55% 40%,transparent 25%,rgba(3,6,10,.18) 60%,rgba(2,4,7,.68) 100%)}.glass{background:rgba(7,11,16,.78);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.34)}header{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;padding:14px 16px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.kicker{font-size:9px;letter-spacing:.16em;color:#aab3c0;font-weight:700}h1{font:500 clamp(25px,7vw,40px)/.95 Georgia,serif;margin:4px 0 2px}.sub{font-size:11px;color:#aeb7c2}.actions{display:flex;gap:7px}button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:10px 12px;font-weight:650}button:active{transform:scale(.97)}#stats{position:absolute;z-index:6;top:112px;left:14px;padding:11px 13px;border-radius:15px;display:flex;gap:16px}.stat b{display:block;font:400 21px Georgia,serif}.stat span{font-size:9px;color:#aab3c0}.chapters{position:absolute;z-index:6;left:14px;top:186px;display:flex;flex-direction:column;gap:6px}.chapter{font-size:10px;padding:8px 10px;text-align:left;border-radius:999px}.chapter.active{background:rgba(173,145,255,.18);border-color:rgba(190,168,255,.45)}#detail{position:absolute;z-index:7;right:14px;top:112px;width:min(330px,calc(100vw - 28px));padding:14px;border-radius:18px;display:none}#detail.show{display:block}#detail .num{font-size:9px;color:#a995ff;letter-spacing:.12em}#detail h2{font:500 25px Georgia,serif;margin:4px 0 6px}#detail p{margin:6px 0;color:#c1c7cf;font-size:11px;line-height:1.45}.conf{margin-top:10px;font-size:9px;color:#78e7cd}.tray{position:absolute;z-index:6;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));height:94px;padding:8px;border-radius:18px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.tray::-webkit-scrollbar{display:none}.card{width:145px;min-width:145px;text-align:left;padding:9px;border-radius:12px;background:rgba(255,255,255,.04)}.card.active{background:rgba(169,146,255,.16)}.card .time{font-size:9px;color:#aeb7c2}.card strong{display:block;font-size:11px;margin-top:3px;line-height:1.18}.card small{display:block;margin-top:4px;color:#808a97;font-size:8px}.marker{width:46px;height:54px;position:relative;cursor:pointer}.marker:before,.marker:after{content:"";position:absolute;inset:5px 7px 6px;border:1px solid rgba(255,255,255,.42);border-radius:6px;background:#2a3039}.marker:before{transform:rotate(-8deg) translate(-4px,2px)}.marker:after{transform:rotate(6deg) translate(4px,0)}.marker i{position:absolute;z-index:2;inset:2px 5px 7px;border-radius:6px;border:2px solid rgba(255,255,255,.86);background:linear-gradient(145deg,#d6ba7d,#9b7050 34%,#7869be 70%,#26313d);box-shadow:0 7px 24px rgba(0,0,0,.5),0 0 20px rgba(177,148,255,.24)}.marker b{position:absolute;z-index:3;right:-2px;bottom:0;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;font-size:8px;color:#080b10;background:#aa94ff;border:2px solid #0d1117}.maplibregl-ctrl-bottom-right{bottom:115px!important}.maplibregl-ctrl-attrib{background:rgba(4,7,10,.55)!important;color:#8d98a4!important}.maplibregl-ctrl-attrib a{color:#aeb8c4!important}@media(max-width:700px){#stats{top:105px}.chapters{top:174px;max-width:220px}#detail{top:auto;bottom:120px;right:14px;left:14px;width:auto}header .sub{max-width:160px}.actions button:last-child{display:none}}
</style></head><body><div id="map"></div><div class="shade"></div><header class="glass"><div><div class="kicker">MEMORY MAP · REAL PHOTO EVIDENCE</div><h1>NEW YORK</h1><div class="sub">SAT · AUG 15, 2026 · reconstructed from your photos</div></div><div class="actions"><button id="play">▶ Play day</button><button id="reset">↗ Reset</button></div></header><section id="stats" class="glass"><div class="stat"><b>12</b><span>observations</span></div><div class="stat"><b>6</b><span>moments</span></div><div class="stat"><b>3</b><span>chapters</span></div></section><nav class="chapters" id="chapters"></nav><aside id="detail" class="glass"><div class="num" id="dnum"></div><h2 id="dtitle"></h2><p id="dtime"></p><p id="dcopy"></p><div class="conf">● observed from photo metadata · inferred travel shown separately</div></aside><section id="tray" class="tray glass"></section><script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.mjs';
const moments=[
{id:'flatiron',chapter:0,title:'Flatiron aperitivo',label:'FLATIRON',time:'1:14 PM',lat:40.7422,lon:-73.9893,count:1,r:145,copy:'A strong midday photo anchor. The next evidence appears more than three hours later, so the intervening trip remains intentionally blank.'},
{id:'houston',chapter:1,title:'Houston Street color',label:'SOHO / NOLITA',time:'4:32 PM',lat:40.7221,lon:-73.9962,count:1,r:105,copy:'A street-art observation marks the beginning of a dense downtown sequence. This is an observed location, not a claim about the route used to arrive.'},
{id:'patrick',chapter:1,title:'Nolita → Old St. Patrick’s',label:'NOLITA',time:'4:42–4:48 PM',lat:40.72385,lon:-73.99525,count:2,r:155,copy:'Exterior streetscape followed by a church interior. Movement on foot is plausible, but the app does not pretend it continuously tracked you.'},
{id:'garden',chapter:1,title:'Elizabeth Street Garden',label:'GARDEN',time:'5:07–5:12 PM',lat:40.7223,lon:-73.99466,count:5,r:210,copy:'Five photos within five minutes in one tight geographic cluster. This is the clearest high-confidence stop in the sample.'},
{id:'noho',chapter:1,title:'NoHo façades',label:'NOHO',time:'5:35–5:36 PM',lat:40.7265,lon:-73.9941,count:2,r:145,copy:'Two architectural photos only meters apart. The trip plausibly continues north on foot, but the exact path is unknown.'},
{id:'boat',chapter:2,title:'Central Park Boathouse',label:'CENTRAL PARK',time:'7:27 PM',lat:40.7748,lon:-73.9688,count:1,r:165,copy:'A new anchor appears nearly two hours later and almost six kilometers away. The destination is known; the way you traveled uptown is not.'}
];
const chapters=[{name:'Flatiron pause',ids:['flatiron']},{name:'Nolita → NoHo wandering',ids:['houston','patrick','garden','noho']},{name:'Central Park evening',ids:['boat']}];
const conns=[['flatiron','houston','unknown'],['houston','patrick','plausible'],['patrick','garden','plausible'],['garden','noho','plausible'],['noho','boat','unknown']];
const style={version:8,sources:{osm:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',layers:[{id:'bg',type:'background',paint:{'background-color':'#081019'}},{id:'water',type:'fill',source:'osm','source-layer':'water',paint:{'fill-color':'#07151e'}},{id:'land',type:'fill',source:'osm','source-layer':'landcover',paint:{'fill-color':['match',['get','class'],'wood','#13231e','grass','#132019','#0d141b'],'fill-opacity':.76}},{id:'roads',type:'line',source:'osm','source-layer':'transportation',minzoom:10,paint:{'line-color':'#303641','line-opacity':.42,'line-width':['interpolate',['linear'],['zoom'],10,.3,16,1.6]}},{id:'buildings',type:'fill-extrusion',source:'osm','source-layer':'building',minzoom:12.4,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],8],0,'#17212c',80,'#222d39',250,'#343a43'],'fill-extrusion-height':['interpolate',['linear'],['zoom'],12.4,0,14,['*',['coalesce',['get','render_height'],8],.83]],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.8}}]};
const map=new maplibregl.Map({container:'map',style,center:[-73.985,40.748],zoom:12.65,pitch:62,bearing:-27,maxPitch:82,attributionControl:true});
let markers=[],revealed=moments.length,active=null,playing=false;
const circle=(lon,lat,r,n=32)=>{let c=[],mpd=111320,mpl=mpd*Math.cos(lat*Math.PI/180);for(let i=0;i<=n;i++){let a=i/n*Math.PI*2;c.push([lon+Math.cos(a)*r/mpl,lat+Math.sin(a)*r/mpd])}return c};
function sourceData(){let feats=[];moments.slice(0,revealed).forEach((m,i)=>{feats.push({type:'Feature',properties:{i},geometry:{type:'Polygon',coordinates:[circle(m.lon,m.lat,m.r)]}})});return{type:'FeatureCollection',features:feats}}
function lineData(){let ids=new Set(moments.slice(0,revealed).map(m=>m.id));return{type:'FeatureCollection',features:conns.filter(c=>ids.has(c[0])&&ids.has(c[1])).map(c=>{let a=moments.find(m=>m.id===c[0]),b=moments.find(m=>m.id===c[1]);return{type:'Feature',properties:{confidence:c[2]},geometry:{type:'LineString',coordinates:[[a.lon,a.lat],[b.lon,b.lat]]}}})}}
function draw(){map.getSource('obs')?.setData(sourceData());map.getSource('links')?.setData(lineData());markers.forEach((el,i)=>el.style.opacity=i<revealed?'1':'0');renderTray()}
function select(m,fly=true){active=m.id;document.getElementById('detail').classList.add('show');dnum.textContent=`CHAPTER 0${m.chapter+1} · ${m.label}`;dtitle.textContent=m.title;dtime.textContent=`${m.time} · ${m.count} photo${m.count>1?'s':''}`;dcopy.textContent=m.copy;if(fly)map.flyTo({center:[m.lon,m.lat],zoom:m.id==='boat'?15.1:16,pitch:66,bearing:m.id==='garden'?-18:-25,duration:1400,essential:true});renderTray()}
function renderTray(){tray.innerHTML='';moments.forEach((m,i)=>{let b=document.createElement('button');b.className='card'+(active===m.id?' active':'');b.style.opacity=i<revealed?1:.24;b.innerHTML=`<span class="time">${m.time}</span><strong>${m.title}</strong><small>${m.count} observation${m.count>1?'s':''}</small>`;b.onclick=()=>select(m);tray.appendChild(b)})}
const chaptersEl=document.getElementById('chapters');chapters.forEach((c,i)=>{let b=document.createElement('button');b.className='chapter';b.innerHTML=`<b>0${i+1}</b> &nbsp;${c.name}`;b.onclick=()=>{document.querySelectorAll('.chapter').forEach(x=>x.classList.remove('active'));b.classList.add('active');let ms=moments.filter(m=>c.ids.includes(m.id));let bounds=new maplibregl.LngLatBounds();ms.forEach(m=>bounds.extend([m.lon,m.lat]));map.fitBounds(bounds,{padding:{top:150,bottom:135,left:70,right:70},pitch:60,bearing:-25,duration:1200,maxZoom:15.5})};chaptersEl.appendChild(b)});
function fit(){let b=new maplibregl.LngLatBounds();moments.forEach(m=>b.extend([m.lon,m.lat]));map.fitBounds(b,{padding:{top:155,bottom:135,left:90,right:90},pitch:62,bearing:-27,duration:1200,maxZoom:13.15})}
map.on('load',()=>{map.addSource('obs',{type:'geojson',data:sourceData()});map.addLayer({id:'obsGlow',type:'fill',source:'obs',paint:{'fill-color':['interpolate',['linear'],['get','i'],0,'#e6c475',3,'#a887ff',5,'#75e4c9'],'fill-opacity':.12}});map.addLayer({id:'obsEdge',type:'line',source:'obs',paint:{'line-color':'#c0a4ff','line-opacity':.28,'line-width':1.1}});map.addSource('links',{type:'geojson',data:lineData()});map.addLayer({id:'linksUnknown',type:'line',source:'links',filter:['==',['get','confidence'],'unknown'],paint:{'line-color':'#a4acb7','line-opacity':.38,'line-width':2,'line-dasharray':[1,2.6]}});map.addLayer({id:'linksPlausible',type:'line',source:'links',filter:['==',['get','confidence'],'plausible'],paint:{'line-color':'#a993ff','line-opacity':.8,'line-width':2.5,'line-dasharray':[2,1.4]}});moments.forEach((m,i)=>{let el=document.createElement('div');el.className='marker';el.innerHTML=`<i></i><b>${m.count}</b>`;el.onclick=()=>select(m);new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([m.lon,m.lat]).addTo(map);markers.push(el)});fit();renderTray()});
play.onclick=async()=>{if(playing)return;playing=true;play.textContent='Playing…';active=null;document.getElementById('detail').classList.remove('show');revealed=0;draw();fit();for(let i=1;i<=moments.length;i++){await new Promise(r=>setTimeout(r,i===1?650:1150));revealed=i;draw();select(moments[i-1],false);map.easeTo({center:[moments[i-1].lon,moments[i-1].lat],zoom:i===moments.length?13.4:14.5,pitch:62,bearing:-27,duration:800})}await new Promise(r=>setTimeout(r,850));fit();playing=false;play.textContent='▶ Play day'};reset.onclick=()=>{revealed=moments.length;active=null;document.getElementById('detail').classList.remove('show');draw();fit()};
renderTray();
</script></body></html>
