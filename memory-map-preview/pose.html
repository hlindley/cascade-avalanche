<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Memory Map · Photo View</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#071019}body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}#map{position:absolute;inset:0}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#03060944,transparent 28%,transparent 65%,#03060999)}#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;transition:opacity .25s}.hud{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.chip,.panel{background:rgba(7,11,16,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.chip{padding:9px 11px;border-radius:14px;font-size:10px;line-height:1.35;pointer-events:auto}.chip b{display:block;font-size:12px}.chip span{color:#aab4c0}.panel{position:absolute;z-index:6;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:8px;border-radius:16px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:11px;padding:11px 6px;font-weight:700}button.active{background:rgba(170,148,255,.22);border-color:rgba(190,169,255,.5)}.note{margin-top:7px;font-size:9px;color:#aeb8c4;line-height:1.35}.tune{display:none;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}.tune.show{display:grid}label{font-size:9px;color:#aab4c0}output{float:right;color:#fff}input{width:100%;accent-color:#aa94ff}.capture{width:13px;height:13px;border-radius:50%;background:#6fe5c8;border:2px solid white;box-shadow:0 0 0 5px #6fe5c833}.target{width:14px;height:14px;background:#ffb56a;border:2px solid white;transform:rotate(45deg);box-shadow:0 0 0 5px #ffb56a33}.maplibregl-ctrl-attrib{font-size:8px!important;opacity:.5}@media(min-width:701px){.panel{left:50%;right:auto;width:520px;transform:translateX(-50%)}}</style></head><body><div id="map"></div><div class="shade"></div><img id="photo" src="./noho-pose.jpg" alt="NoHo photo"><div class="hud"><div class="chip"><b>5:36 PM · NoHo</b><span>capture GPS → estimated façade heading</span></div><div class="chip" id="poseRead">58° · pitch 78°</div></div><div class="panel"><div class="modes"><button id="overview">Overview</button><button id="match" class="active">Match</button><button id="compare">Compare</button><button id="showPhoto">Photo</button></div><div class="note" id="note">MapLibre approximation of the camera pose. Tap here to tune heading and pitch.</div><div class="tune" id="tune"><label>Heading <output id="hout">58°</output><input id="heading" type="range" min="0" max="359" value="58"></label><label>Pitch <output id="pout">78°</output><input id="pitch" type="range" min="45" max="85" value="78"></label></div></div><script src="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.js"></script><script>const capture=[-73.9941,40.7265],subject=[-73.99378,40.72668];const style={version:8,sources:{osm:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},layers:[{id:'bg',type:'background',paint:{'background-color':'#081019'}},{id:'water',type:'fill',source:'osm','source-layer':'water',paint:{'fill-color':'#07151e'}},{id:'roads',type:'line',source:'osm','source-layer':'transportation',paint:{'line-color':'#34404b','line-opacity':.55,'line-width':['interpolate',['linear'],['zoom'],14,.5,19,2.2]}},{id:'buildings',type:'fill-extrusion',source:'osm','source-layer':'building',minzoom:12.5,paint:{'fill-extrusion-color':'#34404b','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],12],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.93}}]};const map=new maplibregl.Map({container:'map',style,center:subject,zoom:18,pitch:78,bearing:58,maxPitch:85,attributionControl:true});let heading=58,pitch=78;new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'capture'}),anchor:'center'}).setLngLat(capture).addTo(map);new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'target'}),anchor:'center'}).setLngLat(subject).addTo(map);function setActive(btn){document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}function read(){poseRead.textContent=heading+'° · pitch '+pitch+'°';hout.textContent=heading+'°';pout.textContent=pitch+'°'}function pose(animated=true){photo.style.opacity=0;setActive(match);map[animated?'easeTo':'jumpTo']({center:subject,zoom:18.75,pitch,bearing:heading,duration:1000,essential:true});read()}overview.onclick=()=>{photo.style.opacity=0;setActive(overview);map.easeTo({center:[-73.9940,40.72655],zoom:16.3,pitch:55,bearing:-20,duration:900})};match.onclick=()=>pose(true);compare.onclick=()=>{pose(false);setActive(compare);photo.style.opacity=.42};showPhoto.onclick=()=>{setActive(showPhoto);photo.style.opacity=1};note.onclick=()=>tune.classList.toggle('show');heading.oninput=()=>{heading=+heading.value;pose(false)};pitch.oninput=()=>{pitch=+pitch.value;pose(false)};map.on('load',()=>pose(false));map.on('error',e=>{note.textContent='Map error: '+(e.error&&e.error.message?e.error.message:'unknown')});</script></body></html>
