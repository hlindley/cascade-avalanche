<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Memory Map · Photo + Mosaic Markers v20 Final</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="./photo-modes-v13.css">
<style>
  #photoCanvas{position:absolute;inset:0;z-index:3;width:100%;height:100%;opacity:0;visibility:hidden;pointer-events:none!important;touch-action:none;background:#05070a;transition:opacity .42s ease;will-change:opacity}
  #photoCanvas.visible{opacity:1;visibility:visible}
  #photoBtn{transition:opacity .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
  #photoBtn[aria-disabled="true"]{opacity:.34;filter:saturate(.25)}
  #photoBtn[aria-disabled="false"]{opacity:1;filter:none;box-shadow:inset 0 0 0 1px #69e3cd88;border-color:#69e3cd88}
  #photoBtn.loading[aria-disabled="false"]{animation:photoPulse 1.05s ease-in-out infinite}
  #photoBtn.active{background:#aa94ff3a;border-color:#bea9ff85;animation:none}
  @keyframes photoPulse{0%,100%{opacity:.68}50%{opacity:1}}
  body.photo-visible .shade{opacity:.10}
  body.photo-visible .maplibregl-ctrl-attrib{opacity:.10}

  .memoryClusterMarker{width:94px;height:100px;pointer-events:auto}
  .memoryClusterMarker button{appearance:none;-webkit-appearance:none;width:94px;padding:0;border:0;background:transparent;color:#fff;transform-origin:50% 100%;transition:opacity .42s ease,transform .52s cubic-bezier(.2,.75,.2,1),filter .3s ease;filter:drop-shadow(0 9px 16px rgba(0,0,0,.58));touch-action:manipulation}
  .memoryClusterMarker .mosaic{position:relative;width:84px;height:64px;margin:0 auto;border:2px solid rgba(244,255,252,.94);border-radius:13px;overflow:hidden;background:#14202a;box-shadow:0 0 0 5px rgba(105,227,205,.16);display:grid;gap:2px;padding:2px}
  .memoryClusterMarker canvas.thumb{display:block;min-width:0;min-height:0;width:100%;height:100%;background:#1a2732}
  .memoryClusterMarker .layout-1{grid-template-columns:1fr}
  .memoryClusterMarker .layout-2{grid-template-columns:1fr 1fr}
  .memoryClusterMarker .layout-3{grid-template-columns:1.25fr .75fr;grid-template-rows:1fr 1fr}
  .memoryClusterMarker .layout-3 .thumb:first-child{grid-row:1 / 3}
  .memoryClusterMarker .layout-plus{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .memoryClusterMarker .moreBadge{position:absolute;right:5px;bottom:5px;min-width:25px;height:23px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(4,8,13,.86);border:1px solid rgba(255,255,255,.74);font-size:10px;font-weight:800;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .memoryClusterMarker .label{display:block;margin-top:7px;text-align:center;text-shadow:0 2px 7px #000,0 0 12px #000}
  .memoryClusterMarker .label b,.memoryClusterMarker .label small{display:block;line-height:1.15}
  .memoryClusterMarker .label b{font-size:11px;white-space:nowrap}
  .memoryClusterMarker .label small{font-size:9px;color:#c8d4dc;margin-top:2px}
  .memoryClusterMarker button.world{opacity:1;transform:translateY(0) scale(1)}
  .memoryClusterMarker button.transit{opacity:.92;transform:translateY(0) scale(.92)}
  .memoryClusterMarker button.hidden{opacity:0;transform:translateY(10px) scale(.72);pointer-events:none}
  .memoryClusterMarker button.active .mosaic{border-color:#fff2ba;box-shadow:0 0 0 6px rgba(255,242,186,.22),0 0 24px rgba(255,242,186,.25)}
  @media(max-width:430px){.memoryClusterMarker{width:80px;height:88px}.memoryClusterMarker button{width:80px}.memoryClusterMarker .mosaic{width:72px;height:55px}.memoryClusterMarker .label b{font-size:10px}}
</style>
</head>
<body>
<div id="map"></div><div class="shade"></div><canvas id="photoCanvas" aria-hidden="true"></canvas><div id="status" class="status glass">Starting map…</div>
<div class="top"><div class="chip glass" id="info"><b>NYC Saturday</b><span>Building the trip overview…</span></div><div class="chip glass" id="pose">WORLD</div></div>
<div class="navigator glass">
  <div class="clusters">
    <button id="cluster-flatiron" class="cluster"><b>Flatiron</b><small>1 photo</small></button>
    <button id="cluster-noho" class="cluster"><b>NoHo</b><small>10 photos</small></button>
    <button id="cluster-central" class="cluster"><b>Central Park</b><small>1 photo</small></button>
  </div>
  <div class="observationNav">
    <button id="prevObservation" class="arrow" aria-label="Previous photo">‹</button>
    <div class="observationInfo"><b id="observationTitle">Trip overview</b><span id="observationMeta">12 photos · 3 clusters</span></div>
    <button id="nextObservation" class="arrow" aria-label="Next photo">›</button>
  </div>
  <div id="dots" class="dots"></div>
</div>
<div class="tray glass"><div class="modes"><button id="world" class="active">World</button><button id="clusterMode">Cluster</button><button id="pov">POV</button><button id="photoBtn" type="button" aria-disabled="true">Photo</button></div><div class="note" id="note">World → Cluster → POV. Photo is a same-perspective toggle; clusters use 1/2/3/+ photo mosaics.</div></div>
<script type="module" src="./photo-modes-v20-final-app.js"></script>
</body>
</html>
