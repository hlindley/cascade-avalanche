<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Memory Map · Direct Photos v25</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css"><link rel="stylesheet" href="./photo-modes-v13.css"><link rel="stylesheet" href="./photo-direct-v25.css?v=25"></head><body><div id="map"></div><div class="shade"></div><canvas id="photoCanvas" aria-hidden="true"></canvas><div id="status" class="status glass">Starting map…</div><div class="top"><div class="chip glass" id="info"><b>NYC Saturday</b><span>Building the trip overview…</span></div><div class="chip glass" id="pose">WORLD</div></div><div class="navigator glass"><div class="clusters"><button id="cluster-flatiron" class="cluster"><b>Flatiron</b><small>1 photo</small></button><button id="cluster-noho" class="cluster"><b>NoHo</b><small>10 photos</small></button><button id="cluster-central" class="cluster"><b>Central Park</b><small>1 photo</small></button></div><div class="observationNav"><button id="prevObservation" class="arrow" aria-label="Previous photo">‹</button><div class="observationInfo"><b id="observationTitle">Trip overview</b><span id="observationMeta">12 photos · 3 clusters</span></div><button id="nextObservation" class="arrow" aria-label="Next photo">›</button></div><div id="dots" class="dots"></div></div><div class="tray glass"><div class="modes"><button id="world" class="active">World</button><button id="clusterMode">Cluster</button><button id="pov">POV</button><button id="photoBtn" type="button" aria-disabled="true">Photo</button></div><div class="note" id="note">World → Cluster → POV. Direct JPEG photo transport enabled.</div></div><style>#photoCanvas{position:absolute;inset:0;z-index:3;width:100%;height:100%;opacity:0;visibility:hidden;pointer-events:none!important;touch-action:none;transition:opacity .46s ease;background:#05070a}#photoCanvas.visible{opacity:1;visibility:visible}#photoBtn[aria-disabled="true"]{opacity:.34}#photoBtn[aria-disabled="false"]{opacity:1;box-shadow:inset 0 0 0 1px #69e3cd88}.clusterPhotoMarkerRoot{width:94px;height:100px;pointer-events:auto}.clusterPhotoCard{appearance:none;width:94px;padding:0;border:0;background:transparent;color:#fff;filter:drop-shadow(0 9px 16px rgba(0,0,0,.58));transition:opacity .42s ease,transform .54s cubic-bezier(.2,.75,.2,1)}.clusterPhotoCard .mosaic{position:relative;width:84px;height:64px;margin:0 auto;border:2px solid rgba(244,255,252,.94);border-radius:13px;overflow:hidden;background:#14202a;box-shadow:0 0 0 5px rgba(105,227,205,.16);display:grid;gap:2px;padding:2px}.clusterPhotoCard.layout-1 .mosaic{grid-template-columns:1fr}.clusterPhotoCard.layout-2 .mosaic{grid-template-columns:1fr 1fr}.clusterPhotoCard.layout-3 .mosaic{grid-template-columns:1.25fr .75fr;grid-template-rows:1fr 1fr}.clusterPhotoCard.layout-plus .mosaic{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.clusterPhotoCard .moreBadge{position:absolute;right:5px;bottom:5px;min-width:27px;height:23px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(4,8,13,.86);border:1px solid rgba(255,255,255,.76);font-size:10px;font-weight:800}.clusterPhotoCard .markerLabel{display:block;margin-top:7px;text-align:center;text-shadow:0 2px 7px #000}.clusterPhotoCard .markerLabel b,.clusterPhotoCard .markerLabel small{display:block;line-height:1.15}.clusterPhotoCard .markerLabel b{font-size:11px}.clusterPhotoCard .markerLabel small{font-size:9px;color:#c8d4dc}.clusterPhotoCard.world{opacity:1}.clusterPhotoCard.transit{opacity:.92;transform:scale(.92)}.clusterPhotoCard.hidden{opacity:0;transform:translateY(10px) scale(.72);pointer-events:none}</style><script type="module" src="./photo-direct-v25.js?v=25"></script></body></html>
